name: Fan-in / Public docs

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Optional owner/name to sync only that source'
        required: false
        type: string
      force:
        description: 'Ignore SHA skip'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: docs-fan-in-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fan-in:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qntx/workflows
          ref: v2
          path: _qntx_workflows
          persist-credentials: false
          sparse-checkout: |
            actions/validate-docs-tree

      - id: validator
        run: echo "sha=$(git -C _qntx_workflows rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4'

      - working-directory: _qntx_workflows/actions/validate-docs-tree
        run: bun install --frozen-lockfile

      - run: echo '_qntx_workflows' >>"$GITHUB_WORKSPACE/.git/info/exclude"

      - id: fanin
        run: bun scripts/fan-in.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAN_IN_REPO: ${{ inputs.repo }}
          FAN_IN_FORCE: ${{ inputs.force }}
          DOCS_TREE_CLI: ${{ github.workspace }}/_qntx_workflows/actions/validate-docs-tree/validate-docs-tree.ts
          DOCS_TREE_VALIDATOR_SHA: ${{ steps.validator.outputs.sha }}

      - name: Commit named paths
        if: ${{ success() }}
        shell: bash
        env:
          GIT_USER_NAME: github-actions[bot]
          GIT_USER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git add -- fan-in/state.json content/docs/libs/meta.json content/docs/libs/.refs.json
          if [ -d content/docs/libs ]; then
            while IFS= read -r -d '' d; do
              git add -- "$d"
            done < <(find content/docs/libs -mindepth 1 -maxdepth 1 -type d -print0)
          fi
          git add -u -- content/docs/libs
          if git diff --cached --name-only -- content/docs/libs/index.mdx | grep -q .; then
            echo '::error::editorial content/docs/libs/index.mdx must not be committed'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No fan-in changes.'
            exit 0
          fi
          git commit -m "chore: fan-in public docs"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          echo '::error::Failed to push after 3 attempts.'
          exit 1
      - name: Fail if any source failed
        if: ${{ !cancelled() && steps.fanin.outputs.failed == 'true' }}
        run: |
          echo '::error::one or more fan-in sources failed; successful trees were still committed'
          exit 1
