name: Fan-in / Public docs

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Optional owner/name to sync only that source"
        required: false
        type: string
      force:
        description: "Ignore SHA skip"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: docs-fan-in-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fan-in:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - id: gate
        env:
          REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.repo || '' }}
        run: |
          set -euo pipefail
          if [ ! -f fan-in/manifest.json ]; then
            echo '::error::fan-in/manifest.json missing'
            exit 1
          fi
          n="$(jq -e '.sources | arrays | length' fan-in/manifest.json)"
          dests=0
          if [ -d content/docs/libs ]; then
            dests="$(find content/docs/libs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          fi
          if [ "$n" -eq 0 ] && [ -z "$REPO" ] && [ "$dests" -eq 0 ]; then
            echo 'skip=true' >>"$GITHUB_OUTPUT"
            echo 'fan-in: sources empty and no dest dirs, skip'
          else
            echo 'skip=false' >>"$GITHUB_OUTPUT"
          fi

      - if: ${{ success() && steps.gate.outputs.skip != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qntx/workflows
          ref: v2
          path: _qntx_workflows
          persist-credentials: false

      - id: validator
        if: ${{ success() && steps.gate.outputs.skip != 'true' }}
        run: echo "sha=$(git -C _qntx_workflows rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - if: ${{ success() && steps.gate.outputs.skip != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install validator deps
        if: ${{ success() && steps.gate.outputs.skip != 'true' }}
        working-directory: _qntx_workflows
        run: bun install --frozen-lockfile

      - name: Exclude workflow checkout from git
        if: ${{ success() && steps.gate.outputs.skip != 'true' }}
        run: echo '_qntx_workflows' >>"$GITHUB_WORKSPACE/.git/info/exclude"

      - id: fanin
        if: ${{ success() && steps.gate.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAN_IN_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.repo || '' }}
          FAN_IN_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          DOCS_TREE_VALIDATOR: ${{ github.workspace }}/_qntx_workflows/actions/validate-docs-tree/validate-docs-tree.ts
          DOCS_TREE_VALIDATOR_SHA: ${{ steps.validator.outputs.sha }}
          MARKDOWNLINT_CONFIG: ${{ github.workspace }}/_qntx_workflows/actions/validate-docs-tree/docs-tree.markdownlint.jsonc
        run: bun scripts/fan-in.ts

      - name: Commit named paths
        if: ${{ success() && steps.gate.outputs.skip != 'true' }}
        env:
          GIT_USER_NAME: github-actions[bot]
          GIT_USER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git add -- fan-in/state.json
          git add -- content/docs/libs/meta.json content/docs/libs/.refs.json
          if [ -d content/docs/libs ]; then
            while IFS= read -r -d '' d; do
              git add -- "$d"
            done < <(find content/docs/libs -mindepth 1 -maxdepth 1 -type d -print0)
          fi
          git add -u -- content/docs/libs
          if git diff --cached --name-only -- content/docs/libs/index.mdx | grep -q .; then
            git restore --staged -- content/docs/libs/index.mdx
          fi
          if git diff --cached --name-only -- content/docs/libs/index.mdx | grep -q .; then
            echo '::error::editorial index.mdx must not be staged'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No fan-in changes.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: fan-in public docs"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$i" -eq 3 ]; then
              echo '::error::Failed to push after 3 attempts.'
              exit 1
            fi
            git pull --rebase
          done

      - name: Fail if any source failed
        if: ${{ !cancelled() && steps.gate.outputs.skip != 'true' && steps.fanin.outputs.failed == 'true' }}
        run: |
          echo '::error::one or more fan-in sources failed; successful trees were still committed'
          exit 1
